name: VisionCraft Release CI

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. 0.0.1)'
        required: false
        default: '0.0.1'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build on Ubuntu (Linux)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-base-dev-tools \
            libopencv-dev \
            libfmt-dev \
            nlohmann-json3-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev

      - name: Configure CMake
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build VisionCraft
        run: |
          cmake --build build --config Release --parallel

      - name: Package Linux Binary
        run: |
          tar -czvf VisionCraft-linux-x86_64.tar.gz -C build VisionCraft

      - name: Upload Linux Archive
        uses: actions/upload-artifact@v4
        with:
          name: VisionCraft-linux-x86_64
          path: VisionCraft-linux-x86_64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build on Windows (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Cache OpenCV 4.10.0
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: C:/opencv
          key: opencv-4.10.0-windows-v1

      - name: Download & Extract OpenCV
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-windows.exe"
          Write-Host "Downloading OpenCV 4.10.0 from $url..."
          Invoke-WebRequest -Uri $url -OutFile "opencv-installer.exe"
          Write-Host "Extracting OpenCV..."
          7z x opencv-installer.exe -y -oC:\
          Remove-Item opencv-installer.exe -Force

      - name: Install vcpkg dependencies (fmt, nlohmann-json)
        shell: pwsh
        run: |
          vcpkg install fmt:x64-windows nlohmann-json:x64-windows

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DOpenCV_DIR="C:/opencv/build/x64/vc16/lib"

      - name: Build VisionCraft
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Package Windows Release
        shell: pwsh
        run: |
          Write-Host "Deploying Qt runtime libraries..."
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations build/Release/VisionCraft.exe
          Write-Host "Copying OpenCV runtime DLLs..."
          Copy-Item -Path "C:/opencv/build/x64/vc16/bin/*.dll" -Destination "build/Release" -Force
          if (Test-Path "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll") {
            Write-Host "Copying vcpkg DLLs..."
            Copy-Item -Path "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" -Destination "build/Release" -Force
          }
          Write-Host "Compressing Windows release..."
          Compress-Archive -Path "build/Release/*" -DestinationPath "VisionCraft-windows-x64.zip"

      - name: Upload Windows Archive
        uses: actions/upload-artifact@v4
        with:
          name: VisionCraft-windows-x64
          path: VisionCraft-windows-x64.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine Tag
        id: get_tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.tag_name || '0.0.1' }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.get_tag.outputs.tag }}
        run: |
          echo "Publishing Release for tag: $TAG_NAME"
          ls -la release-assets/
          gh release create "$TAG_NAME" \
            release-assets/VisionCraft-windows-x64.zip \
            release-assets/VisionCraft-linux-x86_64.tar.gz \
            --title "VisionCraft $TAG_NAME" \
            --generate-notes || \
          gh release upload "$TAG_NAME" \
            release-assets/VisionCraft-windows-x64.zip \
            release-assets/VisionCraft-linux-x86_64.tar.gz \
            --clobber
